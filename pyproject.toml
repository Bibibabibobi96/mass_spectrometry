[build-system]
requires = ["setuptools==65.5.0", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-spectrometry-analysis"
version = "0.4.0"
description = "Composable scientific components, assembly and staged mass spectrometry simulation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema>=4.26,<5",
  "referencing>=0.37,<0.38",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "matplotlib>=3.9,<4",
  "Pillow>=12,<13",
  "openpyxl>=3.1,<4",
  "pyarrow==26.0.1",
  "h5py==3.16.0",
]

[project.scripts]
msplatform = "msplatform.cli:main"

[project.optional-dependencies]
cad = ["pywin32>=306; platform_system == 'Windows'"]
cad-step = ["cadquery==2.8.0", "cadquery-ocp==7.9.3.1.1"]
dev = ["ruff==0.15.22", "packaging==26.2"]

[tool.msplatform.optional-dependency-locks]
cad-step = "requirements-cad-step-lock.txt"

# Scientific implementations have one source owner, isolated from repository
# runners and temporary legacy import bridges.
[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["msplatform*"]
namespaces = false

[tool.setuptools.package-data]
"msplatform.physics" = ["data/*.json"]
"msplatform.components.rf_multipole" = ["family_contract.json", "config/**/*.json", "config/**/*.csv", "variants/**/*.json", "variants/**/*.csv", "variants/**/*.ion"]
"msplatform.components.single_reflection_oa_tof" = ["config/**/*.json", "config/**/*.csv"]
"msplatform.components.orthogonal_accelerator" = ["component_contract*.json", "config/*.json"]
"msplatform.components.multi_reflection_tof" = ["*.json", "config/*.json"]
"msplatform.components.dual_cone_tandem_quadrupole" = ["config/*.json", "config/modes/*.json"]
"msplatform.components.ion_processor" = ["config/*.json", "config/modes/*.json"]
"msplatform.components.transverse_helical_filament_wehnelt_electron_gun" = ["config/*.json", "config/modes/*.json"]
"msplatform.workflows.multipole_ip" = ["*.json"]
"msplatform.contracts" = ["schemas/*.schema.json", "particle_count_policy.json"]
"msplatform.examples" = ["*.json", "*.toml"]
"msplatform.backends.simion" = ["resources/*.gem", "resources/*.lua", "resources/*.iob", "resources/*.pa0", "resources/*.fly2", "resources/*.ps1", "resources/*.md", "resources/*.schema.json", "resources/reflectron_voltage_fit_authoring.json", "resources/iob_instance_seeds/*.pa0", "resources/iob_instance_seeds/*.md"]
"msplatform.workflows" = ["resources/*.ps1", "config/*.json"]
"msplatform.backends.comsol" = ["matlab/*.m", "matlab/interface_readiness/*.m", "matlab/mass_filter_reference/*.m", "launcher/*.ps1"]
"msplatform.workflows.single_reflection_flight" = ["*.schema.json"]
"msplatform.execution" = ["resources/*.ps1", "resources/*.lua", "resources/*.json"]
"msplatform.exporters.solidworks" = ["resources/*.m", "resources/*.ps1"]

[tool.setuptools.exclude-package-data]
"msplatform.components.rf_multipole" = ["docs/theory/figures/generate_figures.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
