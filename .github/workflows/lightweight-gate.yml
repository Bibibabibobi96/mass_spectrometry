name: Software verification

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed_scope:
    if: github.event_name == 'push'
    runs-on: windows-latest
    # The selected software scope may contain integration behavior suites.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Normalize LF-governed checkout
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git reset --hard HEAD
          git checkout-index --force --all
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Configure canonical test temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporaryRoot = & python -c 'import os; from pathlib import Path; print(Path(os.environ["RUNNER_TEMP"]).resolve(strict=True))'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the runner temporary directory.' }
          "TEMP=$temporaryRoot" >> $env:GITHUB_ENV
          "TMP=$temporaryRoot" >> $env:GITHUB_ENV
          Write-Output "CI_TEMP_ROOT=$temporaryRoot"
      - name: Verify PowerShell host
        shell: pwsh
        run: |
          Write-Output "POWERSHELL_EDITION=$($PSVersionTable.PSEdition) POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          . .\common\require_powershell7.ps1
      - name: Resolve changed scope
        id: scope
        shell: pwsh
        run: |
          $before = '${{ github.event.before }}'
          $after = '${{ github.sha }}'
          $baseAvailable = $false
          if ($before -notmatch '^[0]+$') {
            & git cat-file -e "$before^{commit}" 2>$null
            $baseAvailable = $LASTEXITCODE -eq 0
          }
          if (-not $baseAvailable -and $before -match '^[0-9a-f]{40}$' -and $before -notmatch '^[0]+$') {
            # Fetch only the comparison base, not the repository's full history.
            & git fetch --no-tags --depth=1 origin $before 2>$null
            if ($LASTEXITCODE -eq 0) {
              & git cat-file -e "$before^{commit}" 2>$null
              $baseAvailable = $LASTEXITCODE -eq 0
            }
          }
          $scope = [ordered]@{ full_scope = $true; changed_paths = @() }
          if ($baseAvailable) {
            $changedPaths = @(& git diff --name-only --no-renames --diff-filter=ACMRD "$before..$after")
            if ($LASTEXITCODE -ne 0) { throw 'Unable to calculate changed paths for push gate.' }
            if ($changedPaths.Count -gt 0) {
              $scope.full_scope = $false
              $scope.changed_paths = $changedPaths
            } else {
              Write-Warning 'Push diff is empty; using the full gate catalog.'
            }
          } else {
            Write-Warning 'Push base is unavailable; using the full gate catalog.'
          }
          $scopePath = Join-Path $env:RUNNER_TEMP 'changed_scope.json'
          $scope | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $scopePath -Encoding UTF8
          $python = (Get-Command python).Source
          $planPath = Join-Path $env:RUNNER_TEMP 'software_gate_plan.json'
          $plan = if ($scope.full_scope) {
            @(.\common\verify.ps1 -PythonExe $python -FullScope -PlanOnly -PlanPath $planPath -MaxConcurrency 2)
          } else {
            @(.\common\verify.ps1 -PythonExe $python -ChangedPath $scope.changed_paths -PlanOnly -PlanPath $planPath -MaxConcurrency 2)
          }
          $plan | Write-Output
          $planLine = @($plan | Where-Object { $_ -like 'CHANGED_GATE_PLAN=PASS*' })
          if ($planLine.Count -ne 1 -or $planLine[0] -notmatch 'DEPENDENCY_PROFILE=(stdlib|locked)') {
            throw 'Changed-scope dependency plan is missing or ambiguous.'
          }
          "dependency_profile=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install locked Python dependencies
        if: steps.scope.outputs.dependency_profile == 'locked'
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Run changed-scope gate
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PUBLIC_GATE_POWERSHELL = (Get-Process -Id $PID).Path
          $env:PUBLIC_GATE_PYTHON = $python
          @'
          import json, os, platform, subprocess, sys, time
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          scope = json.loads((root / "changed_scope.json").read_text(encoding="utf-8-sig"))
          gate_script = r"""$ErrorActionPreference = 'Stop'
          .\common\verify.ps1 -PlanPath (Join-Path $env:RUNNER_TEMP 'software_gate_plan.json') -MaxConcurrency 2 -SummaryPath (Join-Path $env:RUNNER_TEMP 'changed_gate_summary.json')
          exit $LASTEXITCODE
          """
          command = [os.environ["PUBLIC_GATE_POWERSHELL"], "-NoProfile", "-Command", gate_script]
          record = {"schema_version": 1, "role": "public_gate_command_timing", "command": command,
                    "scope": scope, "source_sha": os.environ.get("GITHUB_SHA"),
                    "environment": {"python_executable": sys.executable, "python_version": sys.version,
                                    "platform": platform.platform()},
                    "summary_path": str(root / "changed_gate_summary.json"), "exit_code": None}
          started = time.perf_counter()
          try:
              # Inherit stdout/stderr: immediate gate failures must remain live.
              result = subprocess.run(command, check=False)
              record["exit_code"] = result.returncode
          except BaseException as error:
              record["error"] = {"type": type(error).__name__, "message": str(error)}
              raise
          finally:
              record["elapsed_wall_seconds"] = time.perf_counter() - started
              timing_path = root / "changed_gate_command_timing.json"
              timing_path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
              print(f"PUBLIC_GATE_COMMAND EXIT_CODE={record['exit_code']} ELAPSED_WALL_SECONDS={record['elapsed_wall_seconds']:.6f} TIMING_PATH={timing_path}", flush=True)
          sys.exit(result.returncode)

          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload changed-scope gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-scope-gate-evidence
          path: |
            ${{ runner.temp }}/software_gate_plan.json
            ${{ runner.temp }}/changed_gate_summary.json
            ${{ runner.temp }}/changed_gate_command_timing.json
            ${{ runner.temp }}/changed_gate_*/**
          if-no-files-found: warn
  repository_integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Configure canonical test temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporaryRoot = & python -c 'import os; from pathlib import Path; print(Path(os.environ["RUNNER_TEMP"]).resolve(strict=True))'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the runner temporary directory.' }
          "TEMP=$temporaryRoot" >> $env:GITHUB_ENV
          "TMP=$temporaryRoot" >> $env:GITHUB_ENV
          Write-Output "CI_TEMP_ROOT=$temporaryRoot"
      - name: Verify PowerShell host
        shell: pwsh
        run: |
          Write-Output "POWERSHELL_EDITION=$($PSVersionTable.PSEdition) POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          . .\common\require_powershell7.ps1
      - name: Resolve repository software scope
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          .\common\verify.ps1 -Scope Repository -PythonExe $python -PlanOnly -PlanPath (Join-Path $env:RUNNER_TEMP 'software_gate_plan.json') -MaxConcurrency 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install locked Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Verify repository software scope
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:PUBLIC_GATE_POWERSHELL = (Get-Process -Id $PID).Path
          $env:PUBLIC_GATE_PYTHON = $python
          @'
          import json, os, platform, subprocess, sys, time
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          scope = {"scope": "Repository"}
          command = [os.environ["PUBLIC_GATE_POWERSHELL"], "-NoProfile", "-File", "common/verify.ps1", "-PlanPath", str(root / "software_gate_plan.json"), "-MaxConcurrency", "2", "-SummaryPath", str(root / "integration_gate_summary.json")]
          record = {"schema_version": 1, "role": "public_gate_command_timing", "command": command,
                    "scope": scope, "source_sha": os.environ.get("GITHUB_SHA"),
                    "environment": {"python_executable": sys.executable, "python_version": sys.version,
                                    "platform": platform.platform()},
                    "summary_path": str(root / "integration_gate_summary.json"), "exit_code": None}
          started = time.perf_counter()
          try:
              # Inherit stdout/stderr: immediate gate failures must remain live.
              result = subprocess.run(command, check=False)
              record["exit_code"] = result.returncode
          except BaseException as error:
              record["error"] = {"type": type(error).__name__, "message": str(error)}
              raise
          finally:
              record["elapsed_wall_seconds"] = time.perf_counter() - started
              timing_path = root / "integration_gate_command_timing.json"
              timing_path.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
              print(f"PUBLIC_GATE_COMMAND EXIT_CODE={record['exit_code']} ELAPSED_WALL_SECONDS={record['elapsed_wall_seconds']:.6f} TIMING_PATH={timing_path}", flush=True)
          sys.exit(result.returncode)

          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload repository gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-integration-gate-evidence
          path: |
            ${{ runner.temp }}/software_gate_plan.json
            ${{ runner.temp }}/integration_gate_summary.json
            ${{ runner.temp }}/integration_gate_command_timing.json
            ${{ runner.temp }}/repository_integration_gate_*/**
          if-no-files-found: warn
