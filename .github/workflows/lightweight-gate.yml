name: Verification gates

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed_scope:
    if: github.event_name == 'push'
    runs-on: windows-latest
    # L1 can include the full integration suite (~26 min locally), plus setup.
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Normalize LF-governed checkout
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git reset --hard HEAD
          git checkout-index --force --all
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Configure canonical test temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporaryRoot = & python -c 'import os; from pathlib import Path; print(Path(os.environ["RUNNER_TEMP"]).resolve(strict=True))'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the runner temporary directory.' }
          "TEMP=$temporaryRoot" >> $env:GITHUB_ENV
          "TMP=$temporaryRoot" >> $env:GITHUB_ENV
          Write-Output "CI_TEMP_ROOT=$temporaryRoot"
      - name: Verify PowerShell host
        shell: pwsh
        run: |
          Write-Output "POWERSHELL_EDITION=$($PSVersionTable.PSEdition) POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          . .\common\require_powershell7.ps1
      - name: Resolve changed scope
        id: scope
        shell: pwsh
        run: |
          $before = '${{ github.event.before }}'
          $after = '${{ github.sha }}'
          $baseAvailable = $false
          if ($before -notmatch '^[0]+$') {
            & git cat-file -e "$before^{commit}" 2>$null
            $baseAvailable = $LASTEXITCODE -eq 0
          }
          $scope = [ordered]@{ full_scope = $true; changed_paths = @() }
          if ($baseAvailable) {
            $changedPaths = @(& git diff --name-only --no-renames --diff-filter=ACMRD "$before..$after")
            if ($LASTEXITCODE -ne 0) { throw 'Unable to calculate changed paths for push gate.' }
            if ($changedPaths.Count -gt 0) {
              $scope.full_scope = $false
              $scope.changed_paths = $changedPaths
            } else {
              Write-Warning 'Push diff is empty; using the full gate catalog.'
            }
          } else {
            Write-Warning 'Push base is unavailable; using the full gate catalog.'
          }
          $scopePath = Join-Path $env:RUNNER_TEMP 'changed_scope.json'
          $scope | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $scopePath -Encoding UTF8
          $python = (Get-Command python).Source
          $plan = if ($scope.full_scope) {
            @(.\common\verify_changed.ps1 -PythonExe $python -FullScope -PlanOnly -MaxConcurrency 2)
          } else {
            @(.\common\verify_changed.ps1 -PythonExe $python -ChangedPath $scope.changed_paths -PlanOnly -MaxConcurrency 2)
          }
          $plan | Write-Output
          $planLine = @($plan | Where-Object { $_ -like 'CHANGED_GATE_PLAN=PASS*' })
          if ($planLine.Count -ne 1 -or $planLine[0] -notmatch 'DEPENDENCY_PROFILE=(stdlib|locked)') {
            throw 'Changed-scope dependency plan is missing or ambiguous.'
          }
          "dependency_profile=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install locked Python dependencies
        if: steps.scope.outputs.dependency_profile == 'locked'
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Run changed-scope gate
        shell: pwsh
        run: |
          $scopePath = Join-Path $env:RUNNER_TEMP 'changed_scope.json'
          $scope = Get-Content -Raw -LiteralPath $scopePath | ConvertFrom-Json -Depth 4
          $python = (Get-Command python).Source
          if ($scope.full_scope) {
            .\common\verify_changed.ps1 -PythonExe $python -FullScope -MaxConcurrency 2 -SummaryPath (Join-Path $env:RUNNER_TEMP 'changed_gate_summary.json')
          } else {
            Write-Output "CHANGED_SCOPE_CI_PATHS=$(@($scope.changed_paths).Count)"
            .\common\verify_changed.ps1 -PythonExe $python -ChangedPath @($scope.changed_paths) -MaxConcurrency 2 -SummaryPath (Join-Path $env:RUNNER_TEMP 'changed_gate_summary.json')
          }
      - name: Upload changed-scope gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changed-scope-gate-evidence
          path: |
            ${{ runner.temp }}/changed_gate_summary.json
            ${{ runner.temp }}/changed_gate_*/**
          if-no-files-found: warn
  repository_integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Frozen migration records are verified against their original Git blobs.
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Configure canonical test temporary directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporaryRoot = & python -c 'import os; from pathlib import Path; print(Path(os.environ["RUNNER_TEMP"]).resolve(strict=True))'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to resolve the runner temporary directory.' }
          "TEMP=$temporaryRoot" >> $env:GITHUB_ENV
          "TMP=$temporaryRoot" >> $env:GITHUB_ENV
          Write-Output "CI_TEMP_ROOT=$temporaryRoot"
      - name: Verify PowerShell host
        shell: pwsh
        run: |
          Write-Output "POWERSHELL_EDITION=$($PSVersionTable.PSEdition) POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          . .\common\require_powershell7.ps1
      - name: Install locked Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Run repository integration gate
        shell: pwsh
        run: .\common\verify_repository_integration.ps1 -PythonExe (Get-Command python).Source -MaxConcurrency 2 -SummaryPath (Join-Path $env:RUNNER_TEMP 'integration_gate_summary.json')
      - name: Upload repository gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-integration-gate-evidence
          path: |
            ${{ runner.temp }}/integration_gate_summary.json
            ${{ runner.temp }}/repository_integration_gate_*/**
          if-no-files-found: warn
