name: Verification gates

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightweight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed_scope:
    if: github.event_name == 'push'
    runs-on: windows-latest
    # RF quadrupole L1 uses the measured ~21 s Core contract gate; full Static is L2.
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify PowerShell host
        shell: pwsh
        run: |
          Write-Output "POWERSHELL_EDITION=$($PSVersionTable.PSEdition) POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          . .\common\require_powershell7.ps1
      - name: Install locked Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Run changed-scope gate
        shell: pwsh
        run: |
          $before = '${{ github.event.before }}'
          $after = '${{ github.sha }}'
          $fallbackChangedPaths = @(
            'README.md',
            'config/project_registry.json',
            'common/verify_changed.ps1',
            'common/contracts/README.md',
            'common/multipole/README.md',
            'common/comsol/README.md',
            'common/solidworks/README.md',
            'projects/oa_tof/README.md',
            'projects/rf_quadrupole_collision_cooling/README.md',
            'projects/rf_hexapole_ion_guide/README.md',
            'projects/rf_octupole_ion_guide/README.md',
            'projects/wehnelt_electron_gun/README.md',
            'projects/electron_impact_ion_source/README.md'
          )
          $baseAvailable = $false
          if ($before -notmatch '^[0]+$') {
            & git cat-file -e "$before^{commit}" 2>$null
            $baseAvailable = $LASTEXITCODE -eq 0
          }
          if (-not $baseAvailable) {
            Write-Warning 'Push base is unavailable; using full-project changed-scope fallback.'
            $changedPaths = $fallbackChangedPaths
          } else {
            $changedPaths = @(& git diff --name-only --diff-filter=ACMRD "$before..$after")
            if ($LASTEXITCODE -ne 0) { throw 'Unable to calculate changed paths for push gate.' }
            if ($changedPaths.Count -eq 0) {
              Write-Warning 'Push diff is empty; using full-project changed-scope fallback.'
              $changedPaths = $fallbackChangedPaths
            }
          }
          Write-Output "CHANGED_SCOPE_CI_BASE=$before HEAD=$after PATHS=$($changedPaths.Count)"
          .\common\verify_changed.ps1 -PythonExe (Get-Command python).Source -ChangedPath $changedPaths
  repository_integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Verify PowerShell host
        shell: pwsh
        run: |
          Write-Output "POWERSHELL_EDITION=$($PSVersionTable.PSEdition) POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          . .\common\require_powershell7.ps1
      - name: Install locked Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt
      - name: Run repository integration gate
        shell: pwsh
        run: .\common\verify_repository_integration.ps1 -PythonExe (Get-Command python).Source
